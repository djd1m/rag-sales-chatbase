function sources(){return shell('<span class="label">ПЕРВЫЙ ПОМОЩНИК</span><h1>С чего начнём?</h1><p class="muted">Добавьте материал, в котором есть ответы на вопросы ваших клиентов.</p>'+progress(1)+'<div class="setup"><section class="card"><h2>Материалы компании</h2><div class="tabs" role="tablist" aria-label="Тип источника"><button role="tab" aria-selected="'+(chosenSource==='website')+'" data-source="website">↗ Сайт</button><button role="tab" aria-selected="'+(chosenSource==='pdf')+'" data-source="pdf">▤ PDF-документ</button></div><form data-form="source">'+(chosenSource==='website'?'<div class="field"><label for="source-url">Адрес сайта</label><input id="source-url" type="url" placeholder="https://example.com" value="https://example.com" required><p>Сайт должен открываться без входа по паролю.</p></div><details><summary>Какие страницы лучше добавить?</summary><p class="muted">Услуги, цены, условия доставки и ответы на частые вопросы.</p></details>':'<div class="dropzone"><strong>Выберите PDF с текстом</strong><p class="muted">Прайс, условия работы или памятка клиенту</p><input type="file" accept="application/pdf" aria-label="Выбрать PDF"><p class="micro muted">До 10 МБ · до 100 страниц · PDF с выделяемым текстом.</p></div><p class="micro muted">Добавьте прайс, условия работы или ответы на частые вопросы.</p>')+'<div class="hint"><span class="icon">i</span><span>Ответы будут основаны на этих материалах. Вы проверите помощника до установки.</span></div><div class="actions"><button class="ghost" type="button" data-go="dashboard">← Назад</button><button class="primary">Продолжить →</button></div></form></section><aside class="card"><span class="label">БЕЗ СЛОЖНЫХ НАСТРОЕК</span><h2 style="margin-top:16px">Добавьте то, что уже есть</h2><p class="muted">Начните с одного полезного источника. Остальные материалы можно добавить позже.</p><ul class="quiet-list"><li>✓ Сайт или PDF</li><li>✓ Проверка перед установкой</li><li>✓ Источники в каждом ответе</li></ul><p class="micro muted">Источник не гарантирует правильность ответа — его проверяет владелец.</p></aside></div>','Помощники','Первый помощник / Материалы')}
function processing(){const failure=processingState==='error';return shell('<span class="label">МАТЕРИАЛЫ КОМПАНИИ</span><h1>'+(failure?'Сайт не удалось прочитать':'Готовим материалы помощника')+'</h1><p class="muted">example.com</p>'+progress(1)+(failure?'<section class="error-box"><span class="errorlabel">Нужен другой способ загрузки</span><h2 style="margin-top:10px">Сайт запрещает автоматическое чтение</h2><p>Вы можете загрузить PDF с нужными сведениями или указать другой сайт. Повторять ту же загрузку не нужно.</p><div class="actions"><button class="primary" data-action="choose-pdf">Загрузить PDF</button><button class="ghost" data-go="sources">Указать другой адрес</button></div><details><summary>Почему это произошло?</summary><p>Сайт ограничивает чтение через robots.txt. Суфлёр соблюдает это ограничение.</p></details></section>':'<section class="card" style="max-width:780px"><h2>'+(processingState==='ready'?'Материалы готовы к проверке':'Читаем ваш сайт')+'</h2><p class="muted">Статус каждого источника виден отдельно. При ошибке поможем выбрать другой способ.</p><div class="source-row"><div><strong>example.com</strong><span class="muted micro">Страницы сайта</span></div><span class="tag good">'+(processingState==='ready'?'Готово':'Обработка')+'</span></div><div class="source-row"><div><strong>Следующий шаг</strong><span class="muted micro">Задайте помощнику вопросы ваших клиентов</span></div><span>→</span></div><div class="actions"><span class="micro muted">На макете показано условное состояние</span><button class="primary" data-go="verify">Перейти к проверке →</button></div></section>')+'<div class="status-options" aria-label="Состояния макета"><button data-state="working">Показать обработку</button><button data-state="ready">Показать готовность</button><button data-state="error">Показать ошибку</button></div>','Помощники','Первый помощник / Обработка')}
function verify(){const unknown=answer==='unknown',human=activeCase==='human';return shell('<div class="check-title"><div><span class="label">ДЕМОНСТРАЦИОННЫЙ ПОМОЩНИК</span><h1>Проверьте ответы перед установкой</h1></div><span class="tag good">Материалы готовы</span></div><p class="muted">Задайте обычный вопрос и вопрос, которого нет в материалах. Проверьте источник ответа.</p>'+progress(2)+'<div class="verify-grid"><aside class="checks"><p class="label">ВОПРОСЫ ДЛЯ ПРОВЕРКИ</p><button class="'+(!unknown?'selected':'')+'" data-answer="known">1. Ответ по материалам<br>Сколько стоит доставка?</button><button class="'+(unknown?'selected':'')+'" data-answer="unknown">2. Нет информации<br>Есть ли рассрочка?</button><button data-answer="human">3. Контакт компании<br>Хочу связаться с человеком</button><p class="micro muted">Используйте формулировки ваших клиентов, а не только удобные тестовые вопросы.</p></aside><section class="chat" aria-label="Проверка помощника"><div class="chathead"><span>Помощник компании</span><span class="tag">ИИ</span></div><div class="chatbody"><div class="bubble muted">Отвечаю по материалам компании. Если информации нет — предложу её контакт.</div><div class="bubble question">'+(human?'Хочу связаться с человеком':unknown?'Есть ли рассрочка?':'Сколько стоит доставка?')+'</div><div class="bubble">'+(human?'Вы можете связаться с компанией напрямую. Покажу контакт, указанный владельцем.':unknown?'В материалах компании нет информации о рассрочке. Уточните условия у сотрудника.':'Доставка по городу — 350 ₽. Самовывоз бесплатный.')+'</div>'+(unknown?'<button class="ghost" data-action="contact">Связаться с компанией ↗</button>':'<button class="ghost small" data-action="source-detail">↗ Источник: Условия доставки</button>')+'</div><form class="composer" data-form="question"><input aria-label="Вопрос к помощнику" placeholder="Задайте свой вопрос…"><button aria-label="Отправить вопрос">↑</button></form><div class="chatfoot">Условные ответы. Запросы к ИИ не function login(){return header()+'<main class="auth"><section class="auth-form"><span class="label">С ВОЗВРАЩЕНИЕМ</span><h1>Войти в Суфлёр</h1><p class="muted">Продолжите работу с вашим помощником.</p><form data-form="login"><div class="field"><label for="email">Почта</label><input id="email" type="email" autocomplete="email" placeholder="you@company.ru" required></div><div class="field"><div class="labelrow"><label for="password">Пароль</label><a class="textlink" href="#recovery" data-action="recovery">Не помню пароль</a></div><div class="passwordrow"><input id="password" type="password" autocomplete="current-password" minlength="8" required><button type="button" aria-pressed="false" data-action="show-password">Показать</button></div></div><button class="primary wide" style="margin-top:12px">Войти</button></form><p class="secondary-text" style="margin-top:22px">Первый раз здесь? <a class="textlink" href="?screen=dashboard" data-go="dashboard">Создать аккаунт</a></p></section><aside class="auth-copy"><span class="tag good">ИСТОЧНИКИ В КАЖДОМ ОТВЕТЕ</span><h2>Помощник, которому вы дали знания</h2><p>Сайт и документы превращаются в ответы клиентам. Сначала вы проверяете их — потом устанавливаете виджет.</p>'+sampleChat()+'</aside></main>'}
function pricing(){return header()+'<main class="wrap"><header class="pricing-title"><span class="label">ТАРИФЫ БЕЗ СЛОЖНЫХ ТЕРМИНОВ</span><h1>Начните бесплатно.<br>Выберите план под свою задачу.</h1><p class="muted">Разовая оплата на 30 дней, без автопродления. Платные цены предварительные.</p></header><div class="plans">'+[{title:'Попробовать',price:'0 ₽',why:'Для знакомства с помощником',tag:'БЕСПЛАТНО',items:['1 помощник','До 50 страниц','300 ответов в месяц','С подписью «Работает на Суфлёре»'],cta:'Создать бесплатно',go:'dashboard'},{title:'Для своего сайта',price:'990 ₽',why:'Без подписи Суфлёра',tag:'ДЛЯ ОДНОГО БИЗНЕСА',items:['1 помощник','До 300 страниц','3 000 ответов в месяц','Без подписи Суфлёра'],cta:'Выбрать план',go:'dashboard'},{title:'Для студии',price:'4 900 ₽',why:'Для сайтов ваших клиентов',tag:'ДЛЯ НЕСКОЛЬКИХ ПРОЕКТОВ',items:['До 10 помощников','До 300 страниц на помощника','3 000 ответов в месяц на помощника','Условия подписи — по плану клиента'],cta:'Обсудить подключение',go:'dashboard'}].map((p,i)=>'<article class="card plan '+(i===1?'featured':'')+'"><span class="tag '+(i===1?'good':'')+'">'+p.tag+'</span><h2>'+p.title+'</h2><p class="muted" style="margin:0">'+p.why+'</p><p class="price">'+p.price+' <small>'+(i?'за 30 дней':'без оплаты')+'</small></p><ul>'+p.items.map(t=>'<li>'+t+'</li>').join('')+'</ul><button class="'+(i===1?'primary':'ghost')+' wide" data-action="'+(i?'plan-demo':'free-demo')+'">'+p.cta+'</button></article>').join('')+'</div><details><summary>Сравнить все ограничения</summary><p class="muted">В реализации здесь будет полная таблица из действующих лимитов сервиса. Значения в макете взяты с текущего публичного экрана.</p></details><section class="subtle-section"><div class="hint"><span class="icon">i</span><span><strong>Что считается ответом?</strong><br>Ответ по вашим материалам или честное «не знаю» с контактом компании. Подробные условия остаются рядом с тарифами.</span></div></section></main>'}
function install(){return shell('<span class="label">ДЕМОНСТРАЦИОННЫЙ ПОМОЩНИК</span><h1>Добавьте помощника на сайт</h1><p class="muted">Скопировать код — первый шаг. После публикации проверьте виджет на странице вашего сайта.</p>'+progress(3)+'<div class="install-grid"><section class="card"><div class="install-step"><span class="number">1</span><div class="body"><h3>Скопируйте код</h3><p>В этом макете показан пример. Рабочий код выдаст сам сервис для вашего помощника.</p><pre>&lt;script src="https://your-domain.example/widget.js"\n  data-bot="DEMO" async&gt;&lt;/script&gt;</pre><button class="primary" data-action="copy-demo-code">Скопировать пример кода</button></div></div><div class="install-step"><span class="number">2</span><div class="body"><h3>Добавьте на ваш сайт</h3><p>Вставьте рабочий код перед закрывающим тегом &lt;/body&gt; и опубликуйте изменения.</p><button class="ghost small" data-action="cms">Как установить в конструкторе ↗</button></div></div><div class="install-step"><span class="number">3</span><div class="body"><h3>Проверьте на странице сайта</h3><div class="field"><label for="install-url">Адрес страницы с виджетом</label><input id="install-url" type="url" value="https://example.com"></div><button class="ghost" data-action="check-install">Открыть страницу и проверить ↗</button><p class="micro muted">Установка подтверждается отдельно от копирования кода.</p></div></div></section><aside class="card"><span class="tag">ОЖИДАЕТ ПРОВЕРКИ</span><h2 style="margin-top:16px">Виджет на вашем сайте</h2><p class="muted">Откройте страницу, разверните чат и задайте один обычный вопрос.</p><ul class="quiet-list"><li>○ Виджет появился</li><li>○ Чат открывается</li><li>○ Получен тестовый ответ</li></ul><p class="note">Автоматическое подтверждение — только при получении реального события. В макете проверка не выполняется.</p></aside></div>','Помощники','Первый помощник / Установка')}
function render(){el.innerHTML=({landing,dashboard,sources,processing,verify,login,pricing,install}[screen]||landing)();bind()}
function bind(){el.querySelectorAll('[data-action=theme]').forEach(b=>b.setAttribute('aria-pressed',String(document.documentElement.dataset.theme==='light')));el.querySelectorAll('[data-go]').forEach(b=>b.onclick=e=>{e.preventDefault();go(b.dataset.go)});el.querySelectorAll('[data-source]').forEach(b=>b.onclick=()=>{chosenSource=b.dataset.source;render()});el.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>{processingState=b.dataset.state;render()});el.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{activeCase=b.dataset.answer;answer=activeCase==='known'?'known':'unknown';render()});el.querySelectorAll('form').forEach(f=>f.onsubmit=e=>{e.preventDefault();if(!f.reportValidity())return;if(['start','source'].includes(f.dataset.form)){if(f.dataset.form==='source')processingState='working';go(f.dataset.form==='start'?'sources':'processing');}else if(f.dataset.form==='question'){answer=f.querySelector('input').value.toLowerCase().includes('рассроч')?'unknown':'known';render()}else if(f.dataset.form==='login')notify('Это макет входа. Данные не отправлены.')});el.querySelectorAll('[data-action]').forEach(b=>b.onclick=e=>{e.preventDefault();const a=b.dataset.action;if(a==='theme')theme();else if(a==='menu')document.getElementById('workspace').classList.toggle('menu-open');else if(a==='choose-pdf'){chosenSource='pdf';go('sources')}else if(a==='show-password'){const input=document.getElementById('password'),show=input.type==='password';input.type=show?'text':'password';b.textContent=show?'Скрыть':'Показать';b.setAttribute('aria-pressed',String(show))}else if(a==='mark-correct'){checkedCases.add(activeCase);questionCount=checkedCases.size;document.getElementById('check-count').textContent=questionCount;notify('Отметка сохранена только в этом макете.')}else if(a==='recovery')notify('Предлагаемый сценарий: письмо со ссылкой для восстановления. Пока не реализовано.');else if(a==='copy-demo-code'){navigator.clipboard?.writeText('<script src="https://your-domain.example/widget.js" data-bot="DEMO" async><\/script>').then(()=>notify('Демонстрационный код скопирован. Это не код действующего помощника.')).catch(()=>notify('Выделите и скопируйте пример вручную.'))}else if(a==='check-install')notify('Макет проверки установки. Реальный сайт не открывался.');else if(a==='free-demo')go('dashboard');else if(a==='plan-demo')notify('Макет выбора плана. Оплата не выполняется.');else if(a==='source-detail')notify('Демонстрационный фрагмент: доставка 350 ₽, самовывоз бесплатный.');else if(a==='contact')notify('В реализации откроется контакт, указанный компанией.');else notify('Демонстрация: этот переход будет реализован после согласования.')})}
window.addEventListener('popstate',()=>{screen=new URLSearchParams(location.search).get('screen')||'landing';render()});if(params.get('theme')==='light')document.documentElement.dataset.theme='light';if(params.get('source')==='pdf')chosenSource='pdf';render();
